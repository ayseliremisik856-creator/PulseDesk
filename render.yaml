# Free preview only: Render's free PostgreSQL expires after 30 days.
databases:
  - name: pulsedesk-db
    databaseName: pulsedesk
    user: pulsedesk
    plan: free
    region: frankfurt

services:
  - type: web
    name: pulsedesk
    runtime: ruby
    plan: free
    region: frankfurt
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:${PORT:-10000}
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulsedesk-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: BUNDLE_DEPLOYMENT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
